name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build the debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The wrapper jar is a binary in the repository, so its checksum is checked
      # against the published Gradle distributions before it is ever executed.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the cache; pull requests read it. Otherwise every
          # branch races to overwrite the same entry.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The runner image ships the Android SDK with licences already accepted, so
      # the Gradle plugin can fetch any platform or build-tools it still needs.
      - name: Show the Android SDK the runner provides
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo '(no platforms installed yet)'

      # core is plain Kotlin/JVM and needs no SDK at all, so a regression in the
      # vault rules, the merge rules or the sync loop fails here in seconds rather
      # than after the whole Android toolchain has warmed up.
      - name: Test core
        run: ./gradlew --no-daemon :core:test

      - name: Build the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: skald-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Only on the way out, and only when something broke: the HTML report says
      # which assertion failed, which the log line does not.
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report-${{ github.sha }}
          path: core/build/reports/tests/test
          if-no-files-found: ignore
