name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build the debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate release metadata
        run: python tools/test_release.py

      - name: Test core
        run: ./gradlew --no-daemon :core:test

      - name: Build the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: skald-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report-${{ github.sha }}
          path: core/build/reports/tests/test
          if-no-files-found: ignore
